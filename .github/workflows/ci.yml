name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - name: Install sandbox prerequisite
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install project and QA tools
        run: python -m pip install -e '.[test,firebase]' ruff build twine
      - name: Lint
        run: ruff check __init__.py cct_agent hermes_plugin scripts tests
      - name: Test
        run: python -m pytest -v --tb=short --junitxml=test-results.xml
      - name: Compile and release hygiene
        run: |
          python -m compileall -q cct_agent hermes_plugin scripts tests
          python scripts/public_release_check.py
      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.python-version }}-test-results
          path: test-results.xml
  firebase:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/hosting/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
        working-directory: firebase/hosting
      - run: npm test && npm run build && npm audit --audit-level=high
        working-directory: firebase/hosting
      - name: Install pinned Firebase emulator CLI
        run: npm install --global firebase-tools@15.16.0 --ignore-scripts
      - name: Firestore rules in demo emulator only
        run: npm run test:rules
        working-directory: firebase/hosting
