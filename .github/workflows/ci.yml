name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and QA tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff build
      - name: Lint
        run: ruff check cct_agent hermes_plugin scripts tests
      - name: Test
        run: python -m pytest -v --tb=short
      - name: Compile
        run: python -m compileall -q cct_agent hermes_plugin scripts tests
      - name: Public release hygiene
        run: python scripts/public_release_check.py
      - name: Build distributions
        run: python -m build
