name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: astral-sh/setup-uv@v6
      - name: Build checksum-pinned sandbox prerequisite
        # Jammy's packaged Bubblewrap lacks --disable-userns. Keep that
        # security boundary; install a compatible binary only on this runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build pkg-config libcap-dev
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/bubblewrap.tar.xz" https://github.com/containers/bubblewrap/releases/download/v0.11.0/bubblewrap-0.11.0.tar.xz
          python -c "import os,pathlib,hashlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'bubblewrap.tar.xz'; assert hashlib.sha256(p.read_bytes()).hexdigest() == '988fd6b232dafa04b8b8198723efeaccdb3c6aa9c1c7936219d5791a8b7a8646'"
          tar -xJf "$RUNNER_TEMP/bubblewrap.tar.xz" -C "$RUNNER_TEMP"
          meson setup "$RUNNER_TEMP/bwrap-build" "$RUNNER_TEMP/bubblewrap-0.11.0" --prefix "$RUNNER_TEMP/bwrap" -Dman=disabled -Dtests=false -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C "$RUNNER_TEMP/bwrap-build"
          meson install -C "$RUNNER_TEMP/bwrap-build"
          python -c "import os,pathlib; print(os.environ['RUNNER_TEMP']+'/bwrap/bin', file=pathlib.Path(os.environ['GITHUB_PATH']).open('a'))"
      - name: Verify required sandbox option
        run: |
          bwrap --version
          python -c "import subprocess; assert '--disable-userns' in subprocess.check_output(['bwrap','--help'],text=True)"
      - name: Install project and QA tools
        run: python -m pip install -e '.[test,firebase]' ruff build twine
      - name: Lint
        run: ruff check __init__.py cct_agent hermes_plugin scripts tests
      - name: Test
        run: python -m pytest -v --tb=short --junitxml=test-results.xml
      - name: Compile and release hygiene
        run: |
          python -m compileall -q cct_agent hermes_plugin scripts tests
          python scripts/public_release_check.py
      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.python-version }}-test-results
          path: test-results.xml
  firebase:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/hosting/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
        working-directory: firebase/hosting
      - run: npm test && npm run build && npm audit --audit-level=high
        working-directory: firebase/hosting
      - name: Install pinned Firebase emulator CLI
        run: npm install --global firebase-tools@15.16.0 --ignore-scripts
      - name: Firestore rules in demo emulator only
        run: npm run test:rules
        working-directory: firebase/hosting
