[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cct-agency-engine"
version = "0.9.0a22"
description = "Choice-Chance-Time Agency Engine for verifiable autonomy within explicit authority"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Michael Costea"}]
dependencies = []
keywords = [
  "ai-agents",
  "agent-governance",
  "autonomy",
  "event-sourcing",
  "hermes-agent",
  "replayability",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8", "PyYAML>=6"]
firebase = [
  "firebase-admin==7.5.0",
  "google-cloud-firestore==2.30.0",
]

[project.scripts]
cct-agent = "cct_agent.cli:main"
cct-engine = "cct_agent.cli:main"
cct-recurrent = "cct_agent.recurrent:main"
cct-release-wake = "cct_agent.release_wake:main"
cct-work-autonomy = "cct_agent.work_autonomy:main"
cct-standing-autonomy = "cct_agent.standing_worker:main"
cct-dashboard = "cct_agent.dashboard_server:main"
cct-dashboard-bootstrap = "cct_agent.dashboard_controls:bootstrap_main"
cct-firebase-bridge = "cct_agent.firebase_bridge:main"
cct-owner-connection = "cct_agent.owner_connection:main"
cct-owner-dialogue = "cct_agent.owner_dialogue:main"
cct-owner-discovery = "cct_agent.owner_discovery:main"

[project.entry-points."hermes_agent.plugins"]
cct-agency = "hermes_plugin"

[project.urls]
Homepage = "https://github.com/five0nit/choice-chance-time-agency-engine"
Repository = "https://github.com/five0nit/choice-chance-time-agency-engine"
Issues = "https://github.com/five0nit/choice-chance-time-agency-engine/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["cct_agent*", "hermes_plugin*"]

[tool.setuptools.package-data]
cct_agent = ["dashboard_static/*.html", "dashboard_static/*.css", "dashboard_static/*.js"]
hermes_plugin = ["plugin.yaml"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "operator_crash_matrix: all eight operator classes recover one crashed same-ticket effect across synchronized OS processes",
]
